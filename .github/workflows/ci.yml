name: CI

# Build + unit-test every push and PR to the production and beta branches.
# Signed with the committed pinned debug keystore (app/debug.keystore) so debug
# APKs keep a stable signature — still no secrets required.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: chmod +x ./gradlew
      - name: Build & unit test (debug)
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Verify debug APK is signed with the pinned debug key
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -n1)"
          ACTUAL="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          echo "APK signer SHA-256: $ACTUAL"
          test "$ACTUAL" = "d243d7b6247feb0d119ffb1171b086c14dd21c827b42c6d1efb8275f7ad0d4e6"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
